name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses nightly-only options, so this runs on nightly. Rolling
      # (unpinned): if a new nightly changes formatting this goes red — the
      # intended signal to re-run scripts/fmt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # The gitignored reference data (Scryfall catalogs, CR keywords, mtgjson
      # AtomicCards) is too bulky to commit to this repo, so it lives in the
      # `deckmaste.rs_data` mirror (public, self-refreshed weekly). Pull it in
      # and stage it so each crate's build.rs detects the fixtures and flips its
      # cfg on — otherwise the catalog/corpus tests below report as `ignored`
      # (they carry `#[cfg_attr(not(<cfg>), ignore)]`).
      #
      # `data/catalogs` + `data/rules` -> `scryfall_catalogs` cfg (the gated
      # keyword-parser tests read `data/rules/keywords.json`, so the cfg
      # requires BOTH dirs) -> the deckmaste_migrations `Subtype`/keyword
      # parser tests run for real. The generate step below also needs
      # `data/rules/keywords.json` at resolve time regardless of that cfg. The
      # mirror is public, so no token/secret — the checkout is tokenless and the
      # steps run for every push and PR (forks included).
      - name: fetch CI data mirror
        uses: actions/checkout@v4
        with:
          repository: msmorgan/deckmaste.rs_data
          path: _data
      - name: stage data (+ decompress mtgjson)
        run: |
          sudo apt-get update && sudo apt-get install -y xz-utils
          mkdir -p data/mtgjson
          cp -r _data/data/catalogs data/
          cp -r _data/data/rules data/
          xz -dkc _data/data/mtgjson/cache/AtomicCards.json.xz > data/mtgjson/AtomicCards.json

      # Generate the gitignored `plugins/wizards` corpus from the staged mtgjson
      # AtomicCards, so each crate's build.rs sets `wizards_corpus` and the
      # otherwise-`ignored` corpus tests run. `generate` runs subtype stubs +
      # extract/resolve/graduate, all satisfiable from the mirror — the
      # keyword/action/ability-word stub generators that once needed
      # `data/rules/cr.json` (and required the old `--minimal` flag to skip) were
      # removed, so plain `generate` no longer touches cr.json. Verified: this
      # corpus passes the full workspace suite (every gated test is green).
      - name: generate wizards corpus
        run: cargo xtask generate plugins/wizards
      # Un-freeze the fixture cfgs: `cargo xtask generate` already BUILT
      # deckmaste_cards (an xtask dependency) before plugins/wizards existed,
      # and the build scripts deliberately emit no `rerun-if-changed` — so
      # without this touch the OFF `wizards_corpus` cfg stays
      # fingerprint-frozen and the deckmaste_cards corpus gates silently
      # report `ignored` below while the run looks green.
      - name: re-run build scripts against the staged fixtures
        run: touch crates/*/build.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # CR coverage ratchet. Unlike `cite check`, this needs no skill and no
      # cr.json — it self-scans committed sources and compares to the committed
      # cr-coverage.lock, so it is green on a clean runner.
      - name: cr coverage ratchet
        run: cargo xtask cite coverage --check
      # NOTE: `cargo xtask cite check` is intentionally not run yet — it shells
      # out to the mtg-rules skill and needs the CR snapshot under data/, neither
      # of which a clean runner has. Wiring it in (install the skill + fetch just
      # the rules snapshot) is a follow-up.
      #
      # The Idris↔Rust lockstep gate does NOT run here. The committed-
      # artifact gates this comment once described (elaborator twin-gate,
      # per-card resolution fixtures) were deleted; their replacement is
      # `cargo xtask idris-check`, which re-emits each Rust card as a raw
      # Core.idr term and typechecks it — and that shells out to a live
      # `idris2`, absent on this runner. So `cargo test` carries no Idris
      # coverage; like cite check, idris-check stays a local gate. Wiring it
      # (or an entailments.ron regen-diff) into CI is a follow-up:
      # docs/tickets/planned/ci-idris-gate.md.
