name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses nightly-only options, so this runs on nightly. Rolling
      # (unpinned): if a new nightly changes formatting this goes red — the
      # intended signal to re-run scripts/fmt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # A bare checkout is enough: the engine tests build game state in Rust, the
      # card tests load the committed plugins/{builtin,canon,testing}, and the
      # keyword-classification drift-guard skips when the mtg-rules skill is
      # absent. Nothing here reads the gitignored ~600 MB data/ dump.
      #
      # Tests that need the generated `plugins/wizards` corpus (gitignored, built
      # by `cargo xtask generate plugins/wizards` from the ~150 MB mtgjson dump
      # under data/, which a clean runner cannot materialize) carry
      # `#[cfg_attr(not(wizards_corpus), ignore)]`. Each crate's build.rs sets the
      # `wizards_corpus` cfg only when the corpus directory is present, so those
      # tests run locally and report as `ignored` here. `cargo test` skips ignored
      # tests by default, so the plain workspace command stays green.
      #
      # Same shape in deckmaste_migrations: its parser tests that mint
      # `Subtype`/keyword atoms load the gitignored `data/catalogs` dump (Scryfall
      # type/keyword catalogs), so they carry `#[cfg_attr(not(scryfall_catalogs),
      # ignore)]` and that crate's build.rs sets `scryfall_catalogs` from the
      # `data/catalogs` directory's presence.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # NOTE: `cargo xtask cite check` is intentionally not run yet — it shells
      # out to the mtg-rules skill and needs the CR snapshot under data/, neither
      # of which a clean runner has. Wiring it in (install the skill + fetch just
      # the rules snapshot) is a follow-up.
      #
      # The Idris↔Rust lockstep gates DO run here, entirely from committed
      # artifacts (no idris2 on the runner): `cargo test` includes the
      # twin-gate test (every checker E-code ↔ its Spec.idr failing block,
      # both directions, via the emitted manifest's `twin:` column and the
      # `-- @twin` annotations) and the resolution-agreement test (the
      # Idris-exported per-card anaphor tables under
      # crates/deckmaste_cards/tests/resolution/ replayed byte-for-byte by
      # the elaborator). Regenerating the tables/fixtures themselves
      # (idris/scripts/emit-tables + a clean `jj st`) needs idris2 and stays
      # a local gate, like cite check.
