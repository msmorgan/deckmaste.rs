name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses nightly-only options, so this runs on nightly. Rolling
      # (unpinned): if a new nightly changes formatting this goes red — the
      # intended signal to re-run scripts/fmt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # The gitignored reference data (Scryfall catalogs, CR keywords, mtgjson
      # AtomicCards) is too bulky to commit to this repo, so it lives in the
      # `deckmaste.rs_data` mirror (public, self-refreshed weekly). Pull the
      # reviewed revision below and stage it so each crate's build.rs detects
      # the fixtures and flips its cfg on — otherwise the catalog/corpus tests
      # below report as `ignored` (they carry
      # `#[cfg_attr(not(<cfg>), ignore)]`). Bump `ref` explicitly after a mirror
      # refresh passes this workflow; never follow the mirror's moving branch.
      #
      # `data/catalogs` + `data/rules` -> `scryfall_catalogs` cfg (the gated
      # keyword-parser tests read `data/rules/keywords.json`, so the cfg
      # requires BOTH dirs) -> the deckmaste_migrations `Subtype`/keyword
      # parser tests run for real. The generate step below also needs
      # `data/rules/keywords.json` at resolve time regardless of that cfg. The
      # mirror is public, so no token/secret — the checkout is tokenless and the
      # steps run for every push and PR (forks included).
      - name: fetch CI data mirror
        uses: actions/checkout@v4
        with:
          repository: msmorgan/deckmaste.rs_data
          path: _data
          ref: c27aa236aa00186b0eca70c7114cc940efc8ec9f
      - name: stage data (+ decompress mtgjson)
        run: |
          sudo apt-get update && sudo apt-get install -y fish xz-utils
          mkdir -p data/mtgjson
          cp -r _data/data/catalogs data/
          cp -r _data/data/rules data/
          xz -dkc _data/data/mtgjson/cache/AtomicCards.json.xz > data/mtgjson/AtomicCards.json
      - name: ticket graph harness
        run: fish tests/todo_test.fish

      # The mirror intentionally carries no raw CR text. Cache one immutable
      # historical snapshot; on a cache miss Academy Ruins sees one request,
      # and the digest turns an upstream replacement into an explicit pin-bump
      # failure rather than silently changing CI's inputs.
      - name: restore pinned Comprehensive Rules
        id: cr-cache
        uses: actions/cache@v4
        with:
          path: data/rules/cr.txt
          key: cr-msh-e366ffd5bee87d6f
      - name: fetch pinned Comprehensive Rules
        if: steps.cr-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Accept: text/plain' \
            --header 'User-Agent: deckmaste.rs CI (+https://github.com/msmorgan/deckmaste.rs)' \
            https://api.academyruins.com/file/cr/MSH \
            --output data/rules/cr.txt
      - name: verify pinned Comprehensive Rules
        run: echo 'e366ffd5bee87d6f676b939524b61a18dfe7822a15cbb22c5dbe565a58e07975  data/rules/cr.txt' | sha256sum --check

      # Reproduce the two gitignored fixtures that used to be present only in
      # a developer checkout. Both derive from pinned inputs: the flat Oracle
      # snapshot from AtomicCards, and the English catalogs from AtomicCards +
      # the versioned CR above.
      - name: derive corpus fixtures
        run: |
          cargo xtask derive-cards
          cargo xtask catalogs

      # Generate the gitignored `plugins/wizards` corpus from the staged mtgjson
      # AtomicCards, so each crate's build.rs sets `wizards_corpus` and the
      # otherwise-`ignored` corpus tests run. `generate` runs subtype stubs +
      # extract/resolve/graduate, all satisfiable from the mirror — the
      # keyword/action/ability-word stub generators that once needed
      # `data/rules/cr.json` (and required the old `--minimal` flag to skip) were
      # removed, so plain `generate` no longer touches cr.json. Verified: this
      # corpus passes the full workspace suite (every gated test is green).
      - name: generate wizards corpus
        run: cargo xtask generate plugins/wizards
      # Un-freeze the fixture cfgs: the xtasks above already BUILT several
      # workspace crates before every generated path existed, and the build
      # scripts deliberately emit no `rerun-if-changed`. Without this touch an
      # OFF cfg can stay fingerprint-frozen and silently report `ignored`.
      - name: re-run build scripts against the staged fixtures
        run: touch crates/*/build.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # Exercise the data-driven WC99 strategy gate with its fixed seed. The
      # 50-game matchup in the same test target is ignored and stays opt-in.
      - name: noncanon WC99 fixed-seed gate
        run: cargo test -p deckmaste_noncanon --features noncanon_tests --test wc99
      # The coverage ratchet self-scans committed sources and compares them to
      # the committed cr-coverage.lock.
      - name: cr coverage ratchet
        run: cargo xtask cite coverage --check
      # Both checks use the digest-verified cr.txt staged above: the first pins
      # cited rule text, while the second rejects loose citation spellings.
      - name: cr citation check
        run: |
          cargo xtask cite check
          cargo xtask cite check --list-noncompliant

  idris:
    name: Idris mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Idris2's official source bootstrap uses Chez Scheme. The exact-key
      # cache is acceleration only: after eviction, the pinned release commit
      # reconstructs the compiler without relying on a third-party binary.
      # Chez stays installed on cache hits because emitted executables invoke
      # it at runtime.
      - name: install Idris2 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential chezscheme libgmp-dev
      - name: restore pinned Idris2
        id: idris-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.idris2
          key: idris2-v1-ubuntu-24.04-${{ runner.arch }}-15a3e4e70843f7a34100f6470c04b791330788df
      - name: fetch pinned Idris2 source
        if: steps.idris-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: idris-lang/Idris2
          ref: 15a3e4e70843f7a34100f6470c04b791330788df
          path: _idris2
      - name: bootstrap pinned Idris2
        if: steps.idris-cache.outputs.cache-hit != 'true'
        working-directory: _idris2
        run: |
          make bootstrap SCHEME=chezscheme VERSION_TAG=15a3e4e70
          make install PREFIX="$HOME/.idris2" VERSION_TAG=15a3e4e70
      - name: expose and verify pinned Idris2
        run: |
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.idris2/bin/idris2" --version)" = \
            "Idris 2, version 0.8.0-15a3e4e70"
      # Save immediately after verification. A later project-model failure is
      # useful signal and should not force the next run to rebuild the compiler.
      - name: save pinned Idris2
        if: steps.idris-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.idris2
          key: idris2-v1-ubuntu-24.04-${{ runner.arch }}-15a3e4e70843f7a34100f6470c04b791330788df

      - name: build Idris model and proof suite
        working-directory: idris
        run: ./scripts/build
      - name: check canon Idris baseline
        run: cargo xtask idris-check plugins/canon
      - name: regenerate entailments and reject drift
        run: |
          cp crates/deckmaste_plugin/tables/entailments.ron "$RUNNER_TEMP/entailments.ron"
          idris/scripts/emit-tables
          diff -u "$RUNNER_TEMP/entailments.ron" crates/deckmaste_plugin/tables/entailments.ron
