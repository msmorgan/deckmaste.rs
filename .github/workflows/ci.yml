name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses nightly-only options, so this runs on nightly. Rolling
      # (unpinned): if a new nightly changes formatting this goes red — the
      # intended signal to re-run scripts/fmt.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: install data tooling
        run: |
          sudo apt-get update && sudo apt-get install -y fish xz-utils
      - name: fetch helper harness
        run: fish tests/fetch_data_test.fish

      # The cache accelerates the ordinary local fetch path; it is not a data
      # mirror or pin. Restore the newest content-addressed snapshot, then
      # conditionally revalidate every upstream input. A changed Oracle or CR
      # snapshot reaches the real gates below as a canary.
      - name: restore cached upstream inputs
        id: data_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/scryfall/cache
            data/catalogs
            data/rules/keywords.json
            data/rules/cr.txt
          key: ci-inputs-v2-${{ runner.os }}-lookup-${{ github.run_id }}
          restore-keys: |
            ci-inputs-v2-${{ runner.os }}-sha256-
      - name: refresh upstream inputs
        run: scripts/fetch_data --minimal --cr
      - name: fingerprint refreshed upstream inputs
        id: data_digest
        env:
          CACHE_PREFIX: ci-inputs-v2-${{ runner.os }}-sha256-
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/ci-inputs.sha256"
          {
            find data/scryfall/cache -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum \
              data/rules/keywords.json \
              data/rules/cr.txt \
              data/catalogs/artifact-types.json \
              data/catalogs/battle-types.json \
              data/catalogs/creature-types.json \
              data/catalogs/enchantment-types.json \
              data/catalogs/flavor-words.json \
              data/catalogs/land-types.json \
              data/catalogs/planeswalker-types.json \
              data/catalogs/spell-types.json
          } > "$manifest"
          digest="$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          echo "key=${CACHE_PREFIX}${digest}" >> "$GITHUB_OUTPUT"
      # Save immediately: a later data-driven test failure is useful canary
      # signal and should not make the next run download the same bytes again.
      - name: save refreshed upstream inputs
        if: steps.data_cache.outputs.cache-matched-key != steps.data_digest.outputs.key
        uses: actions/cache/save@v4
        with:
          path: |
            data/scryfall/cache
            data/catalogs
            data/rules/keywords.json
            data/rules/cr.txt
          key: ${{ steps.data_digest.outputs.key }}

      # Reproduce the gitignored fixtures that used to be present only in a
      # developer checkout: the flat Oracle snapshot, canonical catalogs for
      # english_v2, and legacy text catalogs for legacy consumers.
      - name: derive corpus fixtures
        run: |
          cargo xtask catalogs generate
          cargo xtask catalogs check
          cargo xtask catalogs text
          cargo xtask derive-cards

      - name: check English-v2 flavor-word nursery
        run: cargo xtask english_v2 flavor-words --check

      # Generate the gitignored `plugins/wizards` corpus from the staged Scryfall
      # Oracle Cards snapshot, so each crate's build.rs sets `wizards_corpus` and the
      # otherwise-`ignored` corpus tests run. `generate` runs subtype stubs +
      # extract/resolve/graduate, all satisfiable from the fetched inputs — the
      # keyword/action/ability-word stub generators that once needed
      # `data/rules/cr.json` (and required the old `--minimal` flag to skip) were
      # removed, so plain `generate` no longer touches cr.json. Verified: this
      # corpus passes the full workspace suite (every gated test is green).
      - name: generate wizards corpus
        run: cargo xtask generate plugins/wizards
      # Un-freeze the fixture cfgs: the xtasks above already BUILT several
      # workspace crates before every generated path existed, and the build
      # scripts deliberately emit no `rerun-if-changed`. Without this touch an
      # OFF cfg can stay fingerprint-frozen and silently report `ignored`.
      - name: re-run build scripts against the staged fixtures
        run: touch crates/*/build.rs
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: slow TUI simulation test
        run: cargo test -p deckmaste_tui --features slow-tests
      # Exercise the data-driven WC99 strategy gate with its fixed seed. The
      # 50-game matchup in the same test target is ignored and stays opt-in.
      - name: noncanon WC99 fixed-seed gate
        run: cargo test -p deckmaste_noncanon --features noncanon_tests --test wc99
      # The coverage ratchet self-scans committed sources and compares them to
      # the committed cr-coverage.lock.
      - name: cr coverage ratchet
        run: cargo xtask cite coverage --check
      # Both checks use the freshly revalidated cr.txt above: the first pins
      # cited rule text at rule granularity, while the second rejects loose
      # citation spellings.
      - name: cr citation check
        run: |
          cargo xtask cite check
          cargo xtask cite check --list-noncompliant

  lean:
    name: Lean workbench
    runs-on: ubuntu-24.04
    # The card soundness gate builds xtask and the semantics mirror on top of
    # the workbench build, so this job carries a Rust compile as well.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install elan and the pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://elan.lean-lang.org/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - name: cache Lake dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean', 'lean/lakefile.toml') }}
          restore-keys: |
            lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - name: build Lean model and proof suite
        run: lean/scripts/build
      # The card soundness gate: every `plugins_v2` card is re-emitted as a
      # Lean term and `Card.check` proved empty by `decide`; the gate fails
      # outright if any card does not prove. The generated Lean is untracked
      # and rebuilt here from the plugins as committed.
      - name: card soundness gate
        run: cargo xtask lean-check
      # The gate's own tests are the only place its FAILURE paths run: a card
      # that breaks a Lean law, and a `lake` that fails without naming a card.
      # They need a Lean toolchain, so they belong here rather than in the
      # Rust jobs, which have no elan.
      - name: card soundness gate tests
        run: cargo test -p xtask --test lean_check

  idris:
    name: Idris mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Idris2's official source bootstrap uses Chez Scheme. The exact-key
      # cache is acceleration only: after eviction, the pinned release commit
      # reconstructs the compiler without relying on a third-party binary.
      # Chez stays installed on cache hits because emitted executables invoke
      # it at runtime.
      - name: install Idris2 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential chezscheme libgmp-dev
      - name: restore pinned Idris2
        id: idris-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.idris2
          key: idris2-v1-ubuntu-24.04-${{ runner.arch }}-15a3e4e70843f7a34100f6470c04b791330788df
      - name: fetch pinned Idris2 source
        if: steps.idris-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: idris-lang/Idris2
          ref: 15a3e4e70843f7a34100f6470c04b791330788df
          path: _idris2
      - name: bootstrap pinned Idris2
        if: steps.idris-cache.outputs.cache-hit != 'true'
        working-directory: _idris2
        run: |
          make bootstrap SCHEME=chezscheme VERSION_TAG=15a3e4e70
          make install PREFIX="$HOME/.idris2" VERSION_TAG=15a3e4e70
      - name: expose and verify pinned Idris2
        run: |
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.idris2/bin/idris2" --version)" = \
            "Idris 2, version 0.8.0-15a3e4e70"
      # Save immediately after verification. A later project-model failure is
      # useful signal and should not force the next run to rebuild the compiler.
      - name: save pinned Idris2
        if: steps.idris-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.idris2
          key: idris2-v1-ubuntu-24.04-${{ runner.arch }}-15a3e4e70843f7a34100f6470c04b791330788df

      - name: build Idris model and proof suite
        working-directory: idris
        run: ./scripts/build
      - name: check canon Idris baseline
        run: cargo xtask idris-check plugins/canon
      - name: regenerate entailments and reject drift
        run: |
          cp crates/deckmaste_plugin/tables/entailments.ron "$RUNNER_TEMP/entailments.ron"
          idris/scripts/emit-tables
          diff -u "$RUNNER_TEMP/entailments.ron" crates/deckmaste_plugin/tables/entailments.ron
