[package]
publish = false
name = "deckmaste_english"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
# RuleImpl's generated arm carries &'static runtime::GroupData — the
# declaration-as-data face the constructions! macro emits.
deckmaste_construction_compiler = { version = "0.1.0", path = "../deckmaste_construction_compiler" }
deckmaste_constructions_macro = { version = "0.1.0", path = "../deckmaste_constructions_macro" }
deckmaste_catalogs = { version = "0.1.0", path = "../deckmaste_catalogs" }
deckmaste_features = { version = "0.1.0", path = "../deckmaste_features" }
hashbrown = "0.15.5"
# `Serialize` on the syntax tree is a generic traversal protocol, not a
# serialization format: analysis tools (`cargo xtask english shapes`) drive the
# derive's exhaustive, compiler-checked walk instead of hand-maintaining a
# visitor that every AST change must be mirrored into. Serialize only — nothing
# reconstructs an AST from data.
serde = { version = "1.0.228", features = ["derive", "rc"] }
strum = { version = "0.26.3", features = ["derive"] }
thiserror = { workspace = true }


[dev-dependencies]
proptest = "1.11.0"
ron = "0.12.1"
trybuild = "1.0"
