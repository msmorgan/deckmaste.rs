[package]
publish = false
name = "deckmaste_migrations"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0.102" }
deckmaste_data = { version = "0.1.0", path = "../deckmaste_data" }
deckmaste_catalogs = { version = "0.1.0", path = "../deckmaste_catalogs" }
deckmaste_semantics = { version = "0.1.0", path = "../deckmaste_semantics" }
# No `deckmaste_card`: nothing here speaks the engine's card type any more.
deckmaste_plugin = { version = "0.1.0", path = "../deckmaste_plugin" }
deckmaste_legacy_render = { version = "0.1.0", path = "../deckmaste_legacy_render" }
# Only for `deckmaste_core::plugin` — the path conventions, which the ADR keeps
# core-side. No card content in this crate is spelled in core terms.
deckmaste_core = { version = "0.1.0", path = "../deckmaste_core" }
rayon = "1"
regex = "1.12.3"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
deckmaste_lowering = { version = "0.1.0", path = "../deckmaste_lowering" }
tempfile = "3.27.0"
