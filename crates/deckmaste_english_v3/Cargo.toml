[package]
name = "deckmaste_english_v3"
version = "0.1.0"
edition = "2024"
publish = false

# Forest decomposition has unit tests; declaration witnesses live in tests/.
[lib]
test = true

[lints]
workspace = true

[dependencies]
deckmaste_construction_v3 = { path = "../deckmaste_construction_v3" }
deckmaste_lexical = { version = "0.1.0", path = "../deckmaste_lexical" }
thiserror = { workspace = true }

[dev-dependencies]
deckmaste_lexical_source = { path = "../deckmaste_lexical_source" }
clap = { version = "4.6.1", features = ["derive"] }
# Match xtask's dependency features so tests reuse its optimized library.
libc = "0.2.186"
macro_ron = { path = "../macro_ron", features = ["derive"] }
memchr = "2.8.2"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
