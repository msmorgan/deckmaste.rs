[package]
name = "deckmaste_english_v4"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
deckmaste_data = { version = "0.1.0", path = "../deckmaste_data" }
deckmaste_lexical = { version = "0.1.0", path = "../deckmaste_lexical" }
deckmaste_lexical_source_v4 = { version = "0.1.0", path = "../deckmaste_lexical_source_v4" }
deckmaste_syntax = { version = "0.1.0", path = "../deckmaste_syntax" }
dpsi = { version = "0.1.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
ron = "0.12.1"
deckmaste_syntax = { version = "0.1.0", path = "../deckmaste_syntax", features = ["tree-ranking-key"] }
