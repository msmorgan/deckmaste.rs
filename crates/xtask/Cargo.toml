[package]
publish = false
name = "xtask"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
parser-metrics = ["deckmaste_english_v2/parser-metrics"]

[dependencies]
anyhow = { version = "1.0.102" }
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.2"
deckmaste_card = { version = "0.1.0", path = "../deckmaste_card" }
deckmaste_catalogs = { version = "0.1.0", path = "../deckmaste_catalogs" }
deckmaste_data = { version = "0.1.0", path = "../deckmaste_data" }
deckmaste_english_v3 = { path = "../deckmaste_english_v3" }
deckmaste_english_v2 = { version = "0.1.0", path = "../deckmaste_english_v2" }
deckmaste_lexical = { version = "0.1.0", path = "../deckmaste_lexical" }
deckmaste_lexical_source = { version = "0.1.0", path = "../deckmaste_lexical_source" }
deckmaste_construction_core = { version = "0.1.0", path = "../deckmaste_construction_core" }
deckmaste_semantics = { version = "0.1.0", path = "../deckmaste_semantics" }
deckmaste_semantics_v2 = { version = "0.1.0", path = "../deckmaste_semantics_v2" }
deckmaste_plugin = { version = "0.1.0", path = "../deckmaste_plugin" }
deckmaste_legacy_render = { version = "0.1.0", path = "../deckmaste_legacy_render" }
deckmaste_core = { version = "0.1.0", path = "../deckmaste_core" }
deckmaste_english = { version = "0.1.0", path = "../deckmaste_english" }
libc = "0.2.186"
# `macro inspect` compiles a frame (needs `CompiledFrame`/`compile`); `macro
# templates` only needs the schema (`macro_ron::frames`) and `MacroDef`, but
# both live in the same two crates the frame layer split across.
deckmaste_spelling = { version = "0.1.0", path = "../deckmaste_spelling" }
deckmaste_migrations = { version = "0.1.0", path = "../deckmaste_migrations" }
macro_ron = { version = "0.1.0", path = "../macro_ron" }
# `map enums`: parse Rust sources to find `pub enum` shapes; span-locations
# lets `syn`'s spans report real source line numbers outside a proc-macro.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
rayon = "1"
regex = "1.12.3"
# `macro residuals --drafts` writes a `Vec<ConstructorFrames>` catalog file
# pretty-printed, which `ron::Options`'s own (compact) `to_string` cannot do.
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
thiserror = { workspace = true }
tempfile = "3.27.0"


[dev-dependencies]
deckmaste_english_v2 = { path = "../deckmaste_english_v2", features = ["test-support"] }
