[package]
publish = false
name = "xtask"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0.102" }
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.2"
deckmaste_card = { version = "0.1.0", path = "../deckmaste_card" }
deckmaste_catalogs = { version = "0.1.0", path = "../deckmaste_catalogs" }
deckmaste_data = { version = "0.1.0", path = "../deckmaste_data" }
deckmaste_syntax = { version = "0.1.0", path = "../deckmaste_syntax" }
deckmaste_english_v4 = { version = "0.1.0", path = "../deckmaste_english_v4" }
deckmaste_lexical_source_v4 = { version = "0.1.0", path = "../deckmaste_lexical_source_v4" }
deckmaste_lexical = { version = "0.1.0", path = "../deckmaste_lexical" }
deckmaste_macro_def = { version = "0.1.0", path = "../deckmaste_macro_def" }
deckmaste_semantics = { version = "0.1.0", path = "../deckmaste_semantics" }
deckmaste_semantics_v2 = { version = "0.1.0", path = "../deckmaste_semantics_v2" }
deckmaste_plugin = { version = "0.1.0", path = "../deckmaste_plugin" }
deckmaste_legacy_render = { version = "0.1.0", path = "../deckmaste_legacy_render" }
deckmaste_core = { version = "0.1.0", path = "../deckmaste_core" }
# Reuse the locked substring scanner for JSONL name candidates.
memchr = "2.8.2"
libc = "0.2.186"
deckmaste_migrations = { version = "0.1.0", path = "../deckmaste_migrations" }
macro_ron = { version = "0.1.0", path = "../macro_ron" }
# `map enums`: parse Rust sources to find `pub enum` shapes; span-locations
# lets `syn`'s spans report real source line numbers outside a proc-macro.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
rayon = "1"
regex = "1.12.3"
# `macro residuals --drafts` writes a `Vec<ConstructorFrames>` catalog file
# pretty-printed, which `ron::Options`'s own (compact) `to_string` cannot do.
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3.27.0"


