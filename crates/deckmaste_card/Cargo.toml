[package]
publish = false
name = "deckmaste_card"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
deckmaste_core = { version = "0.1.0", path = "../deckmaste_core" }
# No `macro_ron`: cards are read as semantic terms by `deckmaste_semantics` and
# lowered here, so nothing reads THIS `Card` through a macro set any more.
serde = { version = "1.0.228", features = ["derive", "rc"] }
