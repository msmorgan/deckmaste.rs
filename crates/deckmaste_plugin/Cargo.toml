[package]
publish = false
name = "deckmaste_plugin"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0.102" }
deckmaste_card = { version = "0.1.0", path = "../deckmaste_card" }
deckmaste_core = { version = "0.1.0", path = "../deckmaste_core" }
# The authored rules grammar: the loader parses THIS, and the macro
# configuration (kinds, param types) is the authoring crate's, not a second
# copy over core types (docs/decisions/authoring-spelling-lowering.md §1).
deckmaste_authoring = { version = "0.1.0", path = "../deckmaste_authoring" }
# The one-way compile authored → engine. The loader owns the erasure point:
# `lower` is called here and nowhere upstream of here.
deckmaste_lowering = { version = "0.1.0", path = "../deckmaste_lowering" }
macro_ron = { version = "0.1.0", path = "../macro_ron" }
regex = "1.12.3"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
