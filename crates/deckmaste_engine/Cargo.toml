[package]
publish = false
name = "deckmaste_engine"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
deckmaste_card = { version = "0.1.0", path = "../deckmaste_card" }
deckmaste_core = { version = "0.1.0", path = "../deckmaste_core" }
rand = "0.10.1"
rand_chacha = "0.10.0"
# The emitted entailment table (crates/deckmaste_plugin/tables/entailments.ron)
# is `include_str!`-shared; these parse it (see src/entail.rs).
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
slotmap = { version = "1.1.1", features = ["serde"] }
thiserror = { workspace = true }


[dev-dependencies]
deckmaste_semantics = { version = "0.1.0", path = "../deckmaste_semantics" }
deckmaste_lowering = { version = "0.1.0", path = "../deckmaste_lowering" }
deckmaste_plugin = { version = "0.1.0", path = "../deckmaste_plugin" }
criterion = "0.8"
rayon = "1"
tempfile = "3.27.0"

[[bench]]
name = "full_game"
harness = false
