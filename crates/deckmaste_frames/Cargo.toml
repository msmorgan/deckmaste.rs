[package]
publish = false
name = "deckmaste_frames"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
# `Serialize` on a macro definition or witness is a generic traversal
# protocol here, not a serialization format: `view::of` drives the derive's
# exhaustive, compiler-checked walk instead of hand-maintaining a visitor.
# `derive` is needed by the crate's own driver as well as by callers'
# `#[derive(Serialize)]` types fed into it.
serde = { version = "1.0.228", features = ["derive"] }
# The frame authoring schema (`FrameSpec`, `ConstructorFrames`,
# `load_constructor_frames`) lives in `macro_ron::frames`, not here:
# `MacroDef.frames` needs the type, so schema lives with that data; this
# crate is the engine that will consume it (and eventually `MacroSet`
# itself, to expand macro bodies), so the dependency arrow points this way,
# not the reverse — the reverse direction is what caused the cycle this
# arrangement fixes. `MacroSet` is already needed: the guard normalizer
# reads a guard's RON spelling through it.
macro_ron = { version = "0.1.0", path = "../macro_ron" }
# The frame compiler substitutes witnesses into a frame's text and parses
# the result at a grammatical category, so it needs the English parser.
# `deckmaste_english` stays a leaf: this arrow points into it and it gains
# no dependency of its own.
deckmaste_english = { version = "0.1.0", path = "../deckmaste_english" }
# A guard's constant is a `deckmaste_core` RON term, read at the type its
# param declares. The `param type name -> Rust type` table in `guard.rs`
# needs every macroable core type by name.
deckmaste_core = { version = "0.1.0", path = "../deckmaste_core" }
anyhow = "1.0.102"
