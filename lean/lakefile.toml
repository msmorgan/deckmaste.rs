# Semantics workbench ported from Idris.
#
#   lake build Semantics           -- syntax, checker, macros (the inner loop)
#   lake build SemanticsCards      -- plus the printed-card bench
#   lake build                     -- plus the pin suites (the full gate; ./scripts/build adds --wfail)
name = "mtg"
version = "0.1.0"
defaultTargets = ["Semantics"]

[leanOptions]
# Idris `%unbound_implicits off`: every implicit is written out.
autoImplicit = false

[[lean_lib]]
name = "Semantics"
roots = ["Semantics", "Semantics.Check"]

# The card soundness gate's emitted cards (`cargo xtask lean check`): untracked,
# regenerated per run, and deliberately OUTSIDE `defaultTargets` so
# `./scripts/build` stays the hand workbench's gate and succeeds with no
# `Generated/` present.
[[lean_lib]]
name = "Generated"
roots = ["Generated"]

# The registry definition gate's emitted definitions (`cargo xtask
# lean definitions`): untracked and outside `defaultTargets` exactly as
# `Generated` is, and a library of its own so neither gate clears the other's
# tree.
[[lean_lib]]
name = "GeneratedDefinitions"
roots = ["GeneratedDefinitions"]

# The macro alignment run's proofs (`cargo xtask lean macros align`): every
# hand `Semantics.Macros` macro with a declared namesake, proved equal to the
# generated `Semantics.Macros.Declared` one. Untracked and outside
# `defaultTargets`, as the two gates above are.
[[lean_lib]]
name = "GeneratedMacroAlignment"
roots = ["GeneratedMacroAlignment"]
