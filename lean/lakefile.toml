# Lean port of ../idris — the semantics-v2 grammar workbench.
#
#   lake build Semantics           -- syntax, checker, macros, bench (the inner loop)
#   lake build                     -- plus the pin suites (the full gate; ./scripts/build adds --wfail)
name = "mtg"
version = "0.1.0"
defaultTargets = ["Semantics", "SemanticsProofs"]

[leanOptions]
# Idris `%unbound_implicits off`: every implicit is written out.
autoImplicit = false

[[lean_lib]]
name = "Semantics"
roots = ["Semantics", "Semantics.Check", "Semantics.Macros", "Semantics.Cards"]

[[lean_lib]]
name = "SemanticsProofs"
roots = ["Semantics.Proofs"]
